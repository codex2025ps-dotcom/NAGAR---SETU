name: Planning validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, checked 2026-10-12
        with:
          persist-credentials: false
      - name: Validate planning consistency
        run: python3 tools/validate_planning.py
      - name: Test validator failure cases
        run: python3 -m unittest discover -s tools/tests -v
